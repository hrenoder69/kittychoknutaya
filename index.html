         }

            right: -18px;

        }

        @keyframes floatUp {
            0%   { opacity: 0; transform: translateY(10px); }

        }

    <script>
        const field = document.getElementById("field");
        const cat = document.getElementById("cat");
        const catSkinImages = {
    shadow: "skins/cat-shadow.png",
    jump: "skins/cat-jump.png",
    fridge: "skins/cat-fridge.png",
    boss: "skins/cat-boss.png",
    mask: "skins/cat-mask.png",
    burger: "skins/cat-burger.png",
    gym: "skins/cat-gym.png"
};

const chosenSkin = localStorage.getItem("catSelectedSkin");

if (catSkinImages[chosenSkin]) {
    const skinImage = document.createElement("img");
    skinImage.src = catSkinImages[chosenSkin];
    skinImage.alt = "Кошка";
    cat.replaceChildren(skinImage);
    cat.classList.add("skin-image");
        }
        const start = document.getElementById("start");
        const registerScreen = document.getElementById("registerScreen");
        const registerForm = document.getElementById("registerForm");
        const nicknameInput = document.getElementById("nickname");
        const registerError = document.getElementById("registerError");

        start.disabled = true;

const savedNick = localStorage.getItem("catNickname");
const submitButton = registerForm.querySelector('button[type="submit"]');

async function connectPlayer(nick) {
  const result = await auth.signInAnonymously();
  const playerRef = db.collection("players").doc(result.user.uid);
  const player = await playerRef.get();

 const savedOnlineRecord = Number(
    player.exists ? player.data().record : 0
);

const onlineRecord = Number.isFinite(savedOnlineRecord)
    ? Math.max(0, Math.floor(savedOnlineRecord))
    : 0;

const savedLocalRecord = Number(localStorage.getItem("catRecord"));

const localRecord = Number.isFinite(savedLocalRecord)
    ? Math.max(0, Math.floor(savedLocalRecord))
    : 0;

const bestRecord = Math.max(onlineRecord, localRecord);

const currentCoins = Number(localStorage.getItem("catCoins")) || 0;

await playerRef.set({
    nick: nick,
    record: bestRecord,
}, { merge: true });

localStorage.setItem("catRecord", String(bestRecord));

  localStorage.setItem("catNickname", nick);
  registerScreen.hidden = true;
  start.disabled = false;
}

if (savedNick) {
    registerScreen.hidden = true;
    nicknameInput.value = savedNick;
    start.textContent = "Подключаемся…";

    connectPlayer(savedNick)
        .catch(function (error) {
            console.error(error);
            document.getElementById("message").textContent =
                "Таблица пока недоступна. Можно играть — рекорд сохранится здесь.";
        })
        .finally(function () {
            start.disabled = false;
            start.textContent = "Ловить кошку";
        });
} else {
    registerScreen.hidden = false;
}

registerForm.addEventListener("submit", async function (event) {
  event.preventDefault();

  const nick = nicknameInput.value.trim().replace(/\s+/g, " ");

  if (nick.length < 2) {
    registerError.textContent = "Ник должен быть длиннее одного символа";
    return;
  }

  submitButton.disabled = true;
  registerError.textContent = "Сохраняем ник...";

  try {
    await connectPlayer(nick);
    registerError.textContent = "";
  } catch (error) {
    console.error(error);
    registerError.textContent = "Не удалось сохранить ник. Попробуй ещё раз.";
  } finally {
    submitButton.disabled = false;
  }
});

        const scoreText = document.getElementById("score");
        const timeText = document.getElementById("time");
        const message = document.getElementById("message");
        const recordText = document.getElementById("record");
        const comboText = document.getElementById("combo");
        const comboBanner = document.getElementById("comboBanner");
        const coinsText = document.getElementById("coins");
        const dog = document.getElementById("dog");

        let score = 0;
        let combo = 0;
        let coins = Number(localStorage.getItem("catCoins")) || 0;
        coinsText.textContent = coins.toLocaleString("ru-RU", {
            maximumFractionDigits: 1
        });
        let time = 60;
        let timer;
        let moveTimer;
        let tapTimer;
        let moveDelay;
        let record = Number(localStorage.getItem("catRecord")) || 0;
        recordText.textContent = record;
        let dogTimer;
        let dogHideTimer;
        let dogStunTimer;
        let dogMoveTimer;

        function moveCat() {
            const maxX = field.clientWidth - cat.offsetWidth;
            const maxY = field.clientHeight - cat.offsetHeight;

            cat.style.left = Math.random() * maxX + "px";
            cat.style.top = Math.random() * maxY + "px";
        }

        function moveDog() {
            if (dog.classList.contains("hit") || time <= 0) return;
            const maxX = Math.max(0, field.clientWidth - dog.offsetWidth);
            const maxY = Math.max(0, field.clientHeight - dog.offsetHeight);
            const minY = Math.min(45, maxY);

            dog.style.left = Math.random() * maxX + "px";
            dog.style.top = minY + Math.random() * (maxY - minY) + "px";
        }

        function nextDog() {
            clearTimeout(dogTimer);
                if (moveDelay >=1700) {
                    dog.style.display = "none";
                    return;
                }

           const delay = Math.max(600, moveDelay * 1.5)
               + Math.random() * moveDelay;
            dogTimer = setTimeout(function () {
                if (time <= 0) return;

                const dogMoveDelay = Math.max(450, moveDelay * 1.5);

                dog.style.transition = "none";
                dog.style.display = "block";
                moveDog();
                void dog.offsetWidth;

                const travelTime = Math.min(300, dogMoveDelay * 0.4);
                dog.style.transition =
                    `left ${travelTime}ms ease, top ${travelTime}ms ease`;

                dogMoveTimer = setInterval(moveDog, dogMoveDelay);

                dogHideTimer = setTimeout(function () {
                    clearInterval(dogMoveTimer);
                    dog.style.display = "none";
                    nextDog();
                }, 3000);
            }, delay);
        }           

    start.addEventListener("click", function () {
      clearInterval(timer);
      score = 0;
      time = 60;
      scoreText.textContent = score;
      timeText.textContent = time;
      message.textContent = "лови срочно!";
      combo = 0;
      comboText.textContent = "-";
      comboBanner.classList.remove("active", "bounce");
      cat.style.display = "block";
      start.style.display = "none";
      moveCat();

      moveDelay = Number(document.querySelector('input[name="speed"]:checked').value);

      moveTimer = setInterval(function () {
            moveCat();
      }, moveDelay);

      clearTimeout(dogTimer);
      clearTimeout(dogHideTimer);
      clearTimeout(dogStunTimer);
      clearInterval(dogMoveTimer);
      dog.style.display = "none";
      dog.classList.remove("hit");
      cat.disabled = false;
      cat.style.opacity = "";
      nextDog()

      timer = setInterval(function () {
        time--;
        timeText.textContent = time;

        if (time === 0) {
          clearInterval(timer);
          clearInterval(moveTimer);
          clearTimeout(dogTimer);
          clearTimeout(dogHideTimer);
          clearTimeout(dogStunTimer);
          clearInterval(dogMoveTimer);
          comboBanner.classList.remove("active", "bounce");
          dog.style.display = "none";
          cat.style.display = "none";
          start.style.display = "inline-block";
          start.textContent = "играть еще";
          message.textContent = "кот пойман! " + score + " раз 😼";
          const nick = localStorage.getItem("catNickname");

            if (nick) {
              start.disabled = true;
              start.textContent = "Сохраняем рекорд...";

              connectPlayer(nick)
                  .catch(function (error) {
                      console.error(error);
                      message.textContent +=
                          " Рекорд сохранён на устройстве, но не отправлен в сеть.";
                  })
                  .finally(function () {
                      start.disabled = false;
                      start.textContent = "играть еще";
                  });
          }
        }
      }, 1000);
    });

    cat.addEventListener("click", function () {
      score++;
      scoreText.textContent = score;
      combo++;
      comboText.textContent = combo >= 5 ? "×" + combo : "—";

      if (combo >= 5) {
        comboBanner.textContent = "КОМБО ×" + combo +"!";
        comboBanner.classList.add("active");
        comboBanner.classList.remove("bounce");
        void comboBanner.offsetWidth;
        comboBanner.classList.add("bounce");
      }

      const reward = combo >= 10 ? 2 : combo >= 5 ? 1.5 : 1;
      coins += reward;
      coinsText.textContent = coins.toLocaleString("ru-RU", {
        maximumFractionDigits: 1
    });
      localStorage.setItem("catCoins", coins); 

    if (score > record) {
        record = score;
        recordText.textContent = record;
        localStorage.setItem("catRecord", record);
    }

    if (score % 3 === 0) {
        moveDelay = Math.max(350, moveDelay - 100);
        clearInterval(moveTimer);

        moveTimer = setInterval(function () {
                moveCat();
        }, moveDelay);
    }

      clearTimeout(tapTimer);
      cat.classList.remove("squish");
      void cat.offsetWidth;
      cat.classList.add("squish");

      tapTimer = setTimeout(function () {
        cat.classList.remove("squish");
        if (time > 0) moveCat();
      }, 600);
    })

    field.addEventListener("click", function (event) {
        if (event.target === field && cat.style.display === "block") {
            combo = 0;
            comboText.textContent = "-";
            comboBanner.classList.remove("active", "bounce");
        }
    })

    dog.addEventListener("click", function (event) {
      event.stopPropagation();
      if (dog.classList.contains("hit") || cat.style.display !== "block") return;

      clearTimeout(dogHideTimer);
      clearInterval(dogMoveTimer);
      combo = 0;
      comboText.textContent = "—";
      comboBanner.classList.remove("active", "bounce");
      dog.style.transition = "none";
      dog.style.left = (field.clientWidth - dog.offsetWidth) / 2 + "px";
      dog.style.top = (field.clientHeight - dog.offsetHeight) / 2 + "px";
      cat.disabled = true;
      cat.style.opacity = "0.45";

      dog.classList.add("hit");
      message.textContent = "мопс шотнул тебя на 2,5с";

      dogStunTimer = setTimeout(function () {
        dog.classList.remove("hit");
        dog.style.display = "none";

        if (cat.style.display === "block") {
          cat.disabled = false;
          cat.style.opacity = "";
          message.textContent = "Лови кошку!";
          nextDog();
        }
      }, 2500);
    });

    </script>

<script>
    let pageIsLeaving = false;

    document.addEventListener("click", function (event) {
        const link = event.target.closest("a[href]");

        if (
            !link ||
            event.defaultPrevented ||
            event.button !== 0 ||
            event.ctrlKey ||
            event.metaKey ||
            event.shiftKey ||
            event.altKey ||
            link.hasAttribute("download") ||
            (link.target && link.target !== "_self")
        ) {
            return;
        }

        const destination = new URL(link.href, window.location.href);

        // Анимируем только переходы между страницами нашей игры.
        const gamePages = [
            new URL("index.html", window.location.href).href,
            new URL("skins.html", window.location.href).href,
            new URL("leaderboard.html", window.location.href).href
        ];

        if (
            !gamePages.includes(destination.href) ||
            destination.pathname === window.location.pathname
        ) {
            return;
        }

        event.preventDefault();

        if (pageIsLeaving) return;
        pageIsLeaving = true;

        const reduceMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;

        document.body.classList.add("page-leaving");

        setTimeout(function () {
            window.location.assign(destination.href);
        }, reduceMotion ? 0 : 180);
    });

    // Возвращаем видимость при возврате кнопкой браузера «Назад».
    window.addEventListener("pageshow", function () {
        pageIsLeaving = false;
        document.body.classList.remove("page-leaving");
    });
</script>
