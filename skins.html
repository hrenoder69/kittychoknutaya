<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>скинчеки</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #4b2840;
            background: radial-gradient(circle at top, #fff9fc, #ffe8f1);
        }

        header {
            max-width: 1080px;
            margin: 0 auto;
            padding: 24px 18px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .back, .wallet {
            padding: 11px 17px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 5px 0 #f4bfd1;
            font-weight: bold;
        }

        .back { color: #a84472; text-decoration: none; }
        .wallet { white-space: nowrap; }

        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 18px 18px 60px;
            text-align: center;
        }

        h1 { margin: 24px 0 8px; font-size: clamp(28px, 6vw, 44px); }
        .intro { margin-bottom: 28px; color: #8b5c75; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
        }

        .skin {
            padding: 14px;
            border: 3px solid #ffb5d2;
            border-radius: 23px;
            background: #fff;
            box-shadow: 0 8px 0 #f7c8da;
        }

        .skin.selected { border-color: #ff5b9e; }

        .preview {
            position: relative;
            display: grid;
            place-items: center;
            height: 180px;
            overflow: hidden;
            border-radius: 17px;
            background: linear-gradient(145deg, #ffe7f1, #fff5fa);
            font-size: 88px;
        }

        .preview img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .skin.locked .preview img { filter: blur(9px); opacity: .65; }

        .skin.locked .preview::after {
            content: "🔒";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: #fff5fa44;
            font-size: 42px;
        }

        .skin h2 { margin: 15px 0 7px; font-size: 19px; }
        .cost { min-height: 20px; margin: 0 0 12px; color: #a55e80; }

        .skin button {
            width: 100%;
            min-height: 42px;
            border: 0;
            border-radius: 13px;
            background: #ff69a6;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .skin button:disabled { background: #e8bfd0; cursor: default; }
        #status { min-height: 24px; color: #a84472; font-weight: bold; }

        .unlock-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            place-items: center;
            background: #4b2840aa;
        }

        .unlock-screen.show { display: grid; }

        .unlock-card {
            width: min(90vw, 350px);
            padding: 25px;
            border: 4px solid #ff91bb;
            border-radius: 25px;
            background: white;
            text-align: center;
            box-shadow: 0 15px 35px #4b284055;
            animation: skinReveal 700ms ease-out;
        }

        .unlock-card img {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }

        .unlock-card button {
            padding: 12px 25px;
            border: 0;
            border-radius: 14px;
            background: #ff69a6;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        @keyframes skinReveal {
            0%   { transform: scale(.2) rotate(-12deg); opacity: 0; }
            50%  { transform: scale(1.18) rotate(5deg); opacity: 1; }
            75%  { transform: scale(.92) rotate(-3deg); }
            100% { transform: scale(1) rotate(0); }
        }

.wallet {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 14px 7px 7px;
    border: 2px solid #ff91bb;
    border-radius: 30px;
    background: white;
    box-shadow: 0 5px 0 #efafc8;
    color: #a8326b;
    font-size: 20px;
    font-weight: bold;
}

.pink-coin {
    box-sizing: content-box;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffc6e0, #f5509d);
    border: 2px solid #d94487;
    color: #b82d70;
    font-size: 22px;
    font-weight: bold;
    box-shadow: inset 0 2px 3px #ffffff88;
}

@keyframes pageAppear {
    from { opacity: 0; }
    to { opacity: 1; }
}

body {
    animation: pageAppear 220ms ease-out;
    transition: opacity 180ms ease;
}

body.page-leaving {
    opacity: 0;
    pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
    body {
        animation: none;
        transition: none;
    }
}


.case-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 26px 20px 20px;
    background: linear-gradient(155deg, #fffafd, #fff0f6);
    border-color: #f5b8d0;
    font-family: "Trebuchet MS", Arial, sans-serif;
}
#cases { margin-bottom: 36px; }
.case-icon {
    position: relative;
    width: 128px;
    height: 116px;
    margin: 4px auto 18px;
    filter: drop-shadow(0 9px 6px #b9437426);
}

.case-card h2 {
    margin: 0 0 10px;
    color: #96345f;
    font-size: 23px;
    font-weight: 800;
    line-height: 1.2;
}
.case-card .case-contents {
    margin: 0 0 12px;
    color: #84546b;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.6;
    overflow-wrap: anywhere;
}
.case-card .case-odds {
    margin: auto 0 16px;
    color: #94677c;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
}
.case-card button {
    margin-top: 0;
    padding: 12px;
    background: #d94e8a;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    box-shadow: 0 4px 0 #ad396c;
}
.case-card button:disabled {
    color: #805769;
    background: #efd9e3;
    box-shadow: 0 4px 0 #dfbfce;
}
.case-card button:focus-visible {
    outline: 3px solid #96345f;
    outline-offset: 4px;
}

#caseReel {
    position: relative;
    width: 100%;
    height: 112px;
    margin: 18px 0;
    overflow: hidden;
    border: 2px solid #ff91bb;
    border-radius: 16px;
    background: #fff0f5;
}
#caseReel::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    transform: translateX(-50%);
    background: #a8326b;
    pointer-events: none;
}
#caseTrack {
    display: flex;
    gap: 12px;
    width: max-content;
    height: 100%;
    align-items: center;
}
#caseTrack img {
    flex: 0 0 100px;
    width: 100px;
    height: 90px;
    padding: 5px;
    border-radius: 12px;
    background: white;
    object-fit: contain;
}
#caseReel[hidden], #unlockedImg[hidden] { display: none; }

.case-icon {
    position: relative !important;
    width: 128px !important;
    height: 116px !important;
    margin: 4px auto 18px !important;
    display: block !important;
    overflow: visible !important;
}

.case-icon .gift-box {
    position: absolute !important;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    z-index: 10 !important;

    left: 50% !important;
    top: 25px !important;
    bottom: auto !important;
    transform: translateX(-50%) !important;

    width: 94px !important;
    height: 70px !important;
    box-sizing: border-box !important;

    background: #f58ab5 !important;
    border: 3px solid #c94f85 !important;
    border-radius: 7px !important;

    overflow: visible !important;
    filter: none !important;
    box-shadow: 0 5px 8px rgba(150, 45, 90, 0.3) !important;
}

/* линия крышки */
.case-icon .gift-box::before {
    content: "" !important;
    position: absolute !important;
    top: 14px !important;
    left: -3px !important;
    width: calc(100% + 6px) !important;
    height: 3px !important;
    background: #c94f85 !important;
}

/* сердечко */
.case-icon .gift-box::after {
    content: "♥" !important;
    position: absolute !important;
    left: 50% !important;
    top: 50% !important;
    transform: translate(-50%, -40%) !important;

    color: white !important;
    font-family: Arial, sans-serif !important;
    font-size: 31px !important;
    line-height: 1 !important;
    text-shadow: 0 2px 2px rgba(130, 35, 75, 0.3) !important;
}

/* убираем старый бантик */
.case-icon .gift-lid,
.case-icon .gift-bow {
    display: none !important;
}

    </style>
</head>
<body>
    <header>
        <a class="back" href="index.html">← К игре</a>
        <div class="wallet">
            <span class="pink-coin">$</span>
            <span id="balance">0</span>
        </div>
    </header>

    <main>
        <h1>🐈 могшоп</h1>
        <p class="intro">копи монетки, чтоб открыть кошек.</p>
        <h2>ксго симулятор</h2>
        <p class="intro">каждый кейс - случайный кошак внутри.</p>
        <div id="cases" class="gallery"></div>
        <h2>все кошки</h2>
        <div id="gallery" class="gallery"></div>
        <p id="status" role="status" aria-live="polite"></p>
    </main>

    <div id="unlockScreen" class="unlock-screen">
    <div class="unlock-card">
        <p id="unlockTitle">✨ новый скин открыт!</p>
        <div id="caseReel" hidden><div id="caseTrack"></div></div>
        <img id="unlockedImg" src="" alt="">
        <h2 id="unlockedName"></h2>
        <button id="unlockClose">забрать 🐾</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<script>
    const skinFirebaseConfig = {
        apiKey: "AIzaSyDY--fy5EtcBGIU9rcSx2iXNBUSkAa6mJ0",
        authDomain: "kitten-game-b6abb.firebaseapp.com",
        projectId: "kitten-game-b6abb",
        storageBucket: "kitten-game-b6abb.firebasestorage.app",
        messagingSenderId: "118171282886",
        appId: "1:118171282886:web:e8b3856dd7bba511b3d6c7"
    };

    firebase.initializeApp(skinFirebaseConfig);

    const skinAuth = firebase.auth();
    const skinDb = firebase.firestore();

    async function syncCoinsToLeaderboard(value) {
        const nick = localStorage.getItem("catNickname");

        if (!nick) return;

        try {
            const result = await skinAuth.signInAnonymously();

            await skinDb.collection("players")
                .doc(result.user.uid)
                .set({
                    nick: nick,
                    coins: Number(value) || 0
                }, { merge: true });

        } catch (error) {
            console.error("Монетки не синхронизировались:", error);
        }
    }
</script>

    <script>
        const skins = [
            { id: "default", name: "чокнутая кошка", image: null, price: 0 },
            { id: "gym", name: "батя", image: "skins/cat-gym.png", price: 100 },
            { id: "burger", name: "жыр", image: "skins/cat-burger.png", price: 175 },
            { id: "jump", name: "бедалага", image: "skins/cat-jump.png", price: 255 },
            { id: "fridge", name: "плакса", image: "skins/cat-fridge.png", price: 333 },
            { id: "shadow", name: "сукадьявол", image: "skins/cat-shadow.png", price: 450 },
            { id: "mask", name: "анонимен", image: "skins/cat-mask.png", price: 666 },
            { id: "boss", name: "folkswagen", image: "skins/cat-boss.png", price: 1067 }
        ];


        const cases = [
            { name: "норм кейс", price: 180, skins: ["gym", "burger", "jump"] },
            { name: "огого кейс", price: 390, skins: ["fridge", "shadow"] },
            { name: "нихеровый кейс", price: 870, skins: ["mask", "boss"] }
        ];
        let caseOpening = false;
        const casesGallery = document.getElementById("cases");
        const unlockTitle = document.getElementById("unlockTitle");
        const caseReel = document.getElementById("caseReel");
        const caseTrack = document.getElementById("caseTrack");
        const unlockClose = document.getElementById("unlockClose");

        const gallery = document.getElementById("gallery");
        const balance = document.getElementById("balance");
        const status = document.getElementById("status");
        const unlockScreen = document.getElementById("unlockScreen");
        const unlockedImg = document.getElementById("unlockedImg");
        const unlockedName = document.getElementById("unlockedName");

        document.getElementById("unlockClose").addEventListener("click", function () {
            unlockScreen.classList.remove("show");
        });
        const numberFormat = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 1 });

        let owned;
        try {
            const saved = JSON.parse(localStorage.getItem("catUnlockedSkins") || "[]");
            owned = new Set(Array.isArray(saved) ? saved : []);
        } catch {
            owned = new Set();
        }
        owned.add("default");

        let selected = localStorage.getItem("catSelectedSkin") || "default";
        if (!owned.has(selected)) selected = "default";

        function getCoins() {
            return Number(localStorage.getItem("catCoins")) || 0;
        }

        function renderGallery() {
            const coins = getCoins();
            balance.textContent = numberFormat.format(coins);
            renderCases();
            gallery.replaceChildren();

            for (const skin of skins) {
                const unlocked = owned.has(skin.id);
                const card = document.createElement("article");
                card.className = "skin" + (unlocked ? "" : " locked") +
                    (selected === skin.id ? " selected" : "");

                const preview = document.createElement("div");
                preview.className = "preview";
                if (skin.image) {
                    const img = document.createElement("img");
                    img.src = skin.image;
                    img.alt = skin.name;
                    preview.append(img);
                } else {
                    preview.textContent = "🐈‍⬛";
                }

                const title = document.createElement("h2");
                title.textContent = skin.name;

                const cost = document.createElement("p");
                cost.className = "cost";
                cost.textContent = unlocked ? "открыт" : skin.price + " бабоса";

                const button = document.createElement("button");
                if (!unlocked) {
                    button.textContent = "открыть за " + skin.price + " бабоса 🪙";
                    button.disabled = coins < skin.price;
                    button.addEventListener("click", function () {
                        const currentCoins = getCoins();
                        if (currentCoins < skin.price) return;
                        const remaining = Math.round((currentCoins - skin.price) * 10) / 10;
                        localStorage.setItem("catCoins", String(remaining));
                        syncCoinsToLeaderboard(remaining);
                        owned.add(skin.id);
                        localStorage.setItem("catUnlockedSkins", JSON.stringify([...owned]));
                        selected = skin.id;
                        localStorage.setItem("catSelectedSkin", selected);
                        status.textContent = "открыт скин «" + skin.name + "»!";
                        renderGallery();
                        unlockTitle.textContent = "✨ новый скин открыт!";
                        caseReel.hidden = true;
                        unlockedImg.hidden = false;
                        unlockClose.disabled = false;
                        unlockedImg.src = skin.image;
                        unlockedImg.alt = skin.name;
                        unlockedName.textContent = skin.name;
                        unlockScreen.classList.add("show"); 
                    });
                } else if (selected === skin.id) {
                    button.textContent = "выбран ✓";
                    button.disabled = true;
                } else {
                    button.textContent = "выбрать";
                    button.addEventListener("click", function () {
                        selected = skin.id;
                        localStorage.setItem("catSelectedSkin", selected);
                        status.textContent = "выбран скин «" + skin.name + "»";
                        renderGallery();
                    });
                }

                card.append(preview, title, cost, button);
                gallery.append(card);
            }
        }


        function renderCases() {
            const coins = getCoins();
            casesGallery.replaceChildren();
            for (const box of cases) {
                const card = document.createElement("article");
                card.className = "skin case-card";
                const icon = document.createElement("div");
                icon.className = "case-icon";
                icon.setAttribute("aria-hidden", "true");
                for (const part of ["gift-box", "gift-lid", "gift-bow"]) {
                    const piece = document.createElement("span");
                    piece.className = part;
                    icon.append(piece);
                }
                const title = document.createElement("h2");
                title.textContent = box.name;
                const contents = document.createElement("p");
                contents.className = "case-contents";
                contents.textContent = box.skins
                    .map(id => skins.find(skin => skin.id === id).name).join(" · ");
                const odds = document.createElement("p");
                odds.className = "case-odds";
                odds.textContent = "каждый кот - 1 из " + box.skins.length;
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = "открыть за " + box.price + " монет";
                button.disabled = caseOpening || coins < box.price;
                button.addEventListener("click", function () { openCase(box); });
                card.append(icon, title, contents, odds, button);
                casesGallery.append(card);
            }
        }

        function openCase(box) {
            if (caseOpening) return;
            const coins = getCoins();
            if (coins < box.price) {
                status.textContent = "на этот кейс пока не хватает монеток зай((";
                renderGallery();
                return;
            }
            // Обновляем коллекцию: покупка могла произойти в другой вкладке.
            try {
                const saved = JSON.parse(localStorage.getItem("catUnlockedSkins") || "[]");
                if (Array.isArray(saved)) saved.forEach(id => owned.add(id));
            } catch {}
            const pool = box.skins.map(id => skins.find(skin => skin.id === id));
            const winner = pool[Math.floor(Math.random() * pool.length)];
            const duplicate = owned.has(winner.id);
            const refund = duplicate ? box.price / 2 : 0;
            const nextOwned = new Set(owned);
            nextOwned.add(winner.id);
            const remaining = coins - box.price + refund;

            // Результат сохраняется до прокрутки и не теряется при обновлении.
            try {
                localStorage.setItem("catCoins", String(remaining));
                syncCoinsToLeaderboard(remaining);
                localStorage.setItem("catUnlockedSkins", JSON.stringify([...nextOwned]));
                localStorage.setItem("catSelectedSkin", winner.id);
            } catch (error) {
                console.error(error);
                status.textContent = "не удалось сохранить результат. проверь доступность хранилища браузера.";
                return;
            }
            owned = nextOwned;
            selected = winner.id;
            caseOpening = true;
            renderGallery();

            unlockTitle.textContent = "что за паскуда там сидит а?";
            unlockedName.textContent = "";
            unlockedImg.hidden = true;
            unlockClose.disabled = true;
            caseReel.hidden = false;
            caseTrack.style.transition = "none";
            caseTrack.style.transform = "translateX(0)";
            caseTrack.replaceChildren();

            const winningPosition = 28;
            for (let i = 0; i < 35; i++) {
                const skin = i === winningPosition
                    ? winner : pool[Math.floor(Math.random() * pool.length)];
                const img = document.createElement("img");
                img.src = skin.image;
                img.alt = skin.name;
                caseTrack.append(img);
            }
            unlockScreen.classList.add("show");
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const offset = caseReel.clientWidth / 2 - (winningPosition * 112 + 50);
            void caseTrack.offsetWidth;
            caseTrack.style.transition = reduceMotion
                ? "none" : "transform 4000ms cubic-bezier(0.12, 0.75, 0.15, 1)";
            caseTrack.style.transform = "translateX(" + offset + "px)";

            setTimeout(function () {
                caseReel.hidden = true;
                unlockedImg.src = winner.image;
                unlockedImg.alt = winner.name;
                unlockedImg.hidden = false;
                unlockedName.textContent = winner.name;
                unlockTitle.textContent = duplicate
                    ? "повтор! вернулось " + refund + " монет"
                    : "✨ новый мафиозник в коллекции!";
                status.textContent = duplicate
                    ? "выпал «" + winner.name + "». возвращено " + refund + " монет."
                    : "открыт скин «" + winner.name + "»!";
                caseOpening = false;
                unlockClose.disabled = false;
                renderGallery();
                unlockClose.focus();
            }, reduceMotion ? 0 : 4200);
        }

        renderGallery();
        syncCoinsToLeaderboard(getCoins());
    </script>

<script>
    let pageIsLeaving = false;

    document.addEventListener("click", function (event) {
        const link = event.target.closest("a[href]");

        if (
            !link ||
            event.defaultPrevented ||
            event.button !== 0 ||
            event.ctrlKey ||
            event.metaKey ||
            event.shiftKey ||
            event.altKey ||
            link.hasAttribute("download") ||
            (link.target && link.target !== "_self")
        ) {
            return;
        }

        const destination = new URL(link.href, window.location.href);

        // Анимируем только переходы между страницами нашей игры.
        const gamePages = [
            new URL("index.html", window.location.href).href,
            new URL("skins.html", window.location.href).href,
            new URL("leaderboard.html", window.location.href).href
        ];

        if (
            !gamePages.includes(destination.href) ||
            destination.pathname === window.location.pathname
        ) {
            return;
        }

        event.preventDefault();

        if (pageIsLeaving) return;
        pageIsLeaving = true;

        const reduceMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;

        document.body.classList.add("page-leaving");

        setTimeout(function () {
            window.location.assign(destination.href);
        }, reduceMotion ? 0 : 180);
    });

    // Возвращаем видимость при возврате кнопкой браузера «Назад».
    window.addEventListener("pageshow", function () {
        pageIsLeaving = false;
        document.body.classList.remove("page-leaving");
    });
</script>

</body>
</html>
